<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wetter-Reiseplaner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: rgba(23, 31, 51, 0.65);
            --card-border: rgba(255, 255, 255, 0.09);
            --card-border-glow: rgba(99, 102, 241, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-indigo: #6366f1;
            --accent-purple: #a855f7;
            --accent-sky: #38bdf8;
            --accent-amber: #f59e0b;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --radius-xl: 22px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-glass: 0 12px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            padding-bottom: 40px;
        }

        .app-container { max-width: 1080px; margin: 0 auto; padding: 16px 16px 32px 16px; }
        .app-header { margin-bottom: 24px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon {
            width: 46px; height: 46px; border-radius: var(--radius-lg);
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
            display: flex; align-items: center; justify-content: center; color: #fff;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
        }
        .brand-icon svg { width: 26px; height: 26px; }
        h1 { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, #ffffff 30%, #cbd5e1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; }

        .icon-btn {
            width: 44px; height: 44px; border-radius: var(--radius-lg);
            background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--text-primary); display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(12px); transition: all 0.2s ease;
        }
        .icon-btn:active { transform: scale(0.94); }
        .spinning svg { animation: rotate 1s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .stats-bar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
        @media (min-width: 640px) { .stats-bar { grid-template-columns: repeat(3, 1fr); } }

        .stat-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            backdrop-filter: blur(12px); border-radius: var(--radius-md); padding: 10px 12px;
            display: flex; flex-direction: column;
        }
        .stat-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .stat-value { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); margin-top: 2px; }

        .time-toggle-bar {
            position: sticky; top: 0; z-index: 500; display: flex; flex-wrap: wrap; gap: 10px;
            justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--card-border-glow); border-radius: var(--radius-lg); padding: 12px 14px;
            margin-bottom: 20px; backdrop-filter: blur(20px);
        }
        .toggle-switch { display: flex; gap: 2px; background: rgba(0, 0, 0, 0.35); padding: 4px; border-radius: 30px; }
        .toggle-btn {
            background: transparent; border: none; color: var(--text-muted); padding: 6px 12px;
            border-radius: 20px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
        }
        .toggle-btn.active { background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple)); color: #fff; }

        .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--text-secondary); gap: 14px; }
        .spinner { width: 38px; height: 38px; border: 3px solid rgba(255, 255, 255, 0.1); border-top-color: var(--accent-indigo); border-radius: 50%; animation: rotate 0.8s linear infinite; }

        .weather-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
        @media (min-width: 640px) { .weather-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .weather-grid { grid-template-columns: repeat(3, 1fr); } }

        .weather-card {
            background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(16px);
            border-radius: var(--radius-xl); padding: 18px; box-shadow: var(--shadow-glass); cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .weather-card:hover { border-color: var(--card-border-glow); transform: translateY(-2px); }
        .weather-card.out-of-range { opacity: 0.7; background: rgba(15, 23, 42, 0.5); cursor: default; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
        .city-badge { display: flex; align-items: center; gap: 8px; font-size: 1.15rem; font-weight: 700; }
        .date-pill { background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.1); padding: 4px 10px; border-radius: var(--radius-md); font-size: 0.78rem; color: var(--text-secondary); }

        .card-body { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .weather-info { display: flex; align-items: center; gap: 12px; }
        .weather-icon-wrapper { width: 48px; height: 48px; border-radius: var(--radius-md); background: rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
        .weather-desc { font-size: 0.95rem; font-weight: 600; }
        .temp-box { text-align: right; }
        .temp-max { font-size: 1.4rem; font-weight: 800; }
        .temp-min { font-size: 0.85rem; color: var(--text-muted); }

        .card-metrics { background: rgba(0, 0, 0, 0.22); border-radius: var(--radius-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; font-size: 0.82rem; }
        .metric-row { display: flex; justify-content: space-between; align-items: center; }
        .metric-row.border-top { padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.07); }
        .metric-item { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }

        .card-click-hint {
            font-size: 0.73rem; color: var(--text-muted); text-align: right; margin-top: 10px;
            display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-weight: 600;
        }
        .weather-card:hover .card-click-hint { color: var(--accent-sky); }

        .out-notice { padding: 16px; background: rgba(245, 158, 11, 0.1); border: 1px dashed rgba(245, 158, 11, 0.3); border-radius: var(--radius-md); color: #fcd34d; font-size: 0.85rem; text-align: center; }
        .hidden { display: none !important; }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 8, 16, 0.82); backdrop-filter: blur(16px);
            z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-card {
            background: rgba(15, 23, 42, 0.96); border: 1px solid var(--card-border-glow);
            border-radius: var(--radius-xl); width: 100%; max-width: 820px; max-height: 90vh;
            overflow-y: auto; padding: 24px; position: relative; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }
        .modal-close-btn {
            position: absolute; top: 16px; right: 16px; width: 36px; height: 36px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-primary); font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .modal-close-btn:hover { background: rgba(244, 63, 94, 0.2); color: var(--accent-rose); }
        .modal-header { margin-bottom: 20px; padding-right: 40px; }
        .modal-title-group { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .modal-flag { font-size: 2rem; }
        .modal-city { font-size: 1.5rem; font-weight: 800; color: var(--text-primary); }
        .modal-date { font-size: 0.9rem; color: var(--text-secondary); font-weight: 500; }
        .modal-summary-pills { display: flex; flex-wrap: wrap; gap: 8px; }
        .summary-pill {
            padding: 4px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
            background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .summary-pill.temp-pill { color: #f8fafc; border-color: rgba(99, 102, 241, 0.4); }
        .summary-pill.rain-pill { color: var(--accent-sky); border-color: rgba(56, 189, 248, 0.4); }
        .summary-pill.wind-pill { color: var(--accent-amber); border-color: rgba(245, 158, 11, 0.4); }
        .summary-pill.sun-pill { color: #fde047; border-color: rgba(250, 204, 21, 0.4); }

        .chart-legend { display: flex; gap: 16px; margin-bottom: 12px; font-size: 0.8rem; color: var(--text-secondary); }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 12px; height: 12px; border-radius: 3px; }
        .legend-color.temp-color { background: var(--accent-indigo); }
        .legend-color.rain-color { background: var(--accent-sky); }

        .chart-scroll-container {
            overflow-x: auto; background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 20px;
        }
        .chart-wrapper { min-width: 640px; }

        .hourly-table-container { margin-top: 16px; }
        .table-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; color: var(--text-primary); }
        .hourly-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
        .hourly-card {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-md); padding: 8px 6px; text-align: center; font-size: 0.78rem;
        }
        .hourly-time { font-weight: 700; color: var(--text-secondary); margin-bottom: 4px; }
        .hourly-icon { font-size: 1.2rem; margin: 2px 0; }
        .hourly-temp { font-weight: 800; color: var(--text-primary); }
        .hourly-rain { font-size: 0.72rem; color: var(--accent-sky); margin-top: 2px; }

        .app-footer { margin-top: 36px; text-align: center; font-size: 0.78rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-top">
                <div class="brand">
                    <div class="brand-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/><path d="M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    </div>
                    <div>
                        <h1>Wetter-Reiseplaner</h1>
                        <p class="subtitle">Dynamische Reiseroute</p>
                    </div>
                </div>
                <button id="refresh-btn" class="icon-btn" title="Aktualisieren">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0118.8-4.3M22 12.5a10 10 0 01-18.8 4.2"/></svg>
                </button>
            </div>

            <div class="stats-bar">
                <div class="stat-card">
                    <span class="stat-label">Stopps</span>
                    <span class="stat-value" id="stat-count">0 Stopps</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Spanne (8–20 Uhr)</span>
                    <span class="stat-value" id="stat-temp-range">--</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Status</span>
                    <span class="stat-value" style="color: var(--accent-emerald);">● Live Open-Meteo</span>
                </div>
            </div>
        </header>

        <div class="time-toggle-bar">
            <div style="font-size:0.85rem; font-weight:600; color:var(--text-secondary);">⏱️ Zeitfenster:</div>
            <div class="toggle-switch">
                <button class="toggle-btn active" data-time="8-12">☀️ 8–12</button>
                <button class="toggle-btn" data-time="12-16">🌤️ 12–16</button>
                <button class="toggle-btn" data-time="16-20">🌅 16–20</button>
                <button class="toggle-btn" data-time="8-20">📊 8–20</button>
                <button class="toggle-btn" data-time="24h">🌙 24h</button>
            </div>
        </div>

        <main>
            <div id="loader" class="loader-container">
                <div class="spinner"></div>
                <p>Lade Wetter- & Reisedaten...</p>
            </div>
            <div id="weather-grid" class="weather-grid hidden"></div>
        </main>

        <footer class="app-footer">
            <p>Datenquelle: <a href="https://open-meteo.com/" target="_blank" style="color: var(--accent-sky);">Open-Meteo API</a></p>
        </footer>
    </div>

    <!-- Trend Modal -->
    <div id="trend-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
        <div class="modal-card">
            <button id="modal-close-btn" class="modal-close-btn" aria-label="Schließen">&times;</button>
            
            <div class="modal-header">
                <div class="modal-title-group">
                    <span id="modal-city-flag" class="modal-flag">📍</span>
                    <div>
                        <h2 id="modal-city-name" class="modal-city">Stadt</h2>
                        <p id="modal-date-text" class="modal-date">Datum</p>
                    </div>
                </div>
                <div class="modal-summary-pills">
                    <span id="modal-summary-temp" class="summary-pill temp-pill">--°C</span>
                    <span id="modal-summary-rain" class="summary-pill rain-pill">--</span>
                    <span id="modal-summary-wind" class="summary-pill wind-pill">--</span>
                    <span id="modal-summary-sun" class="summary-pill sun-pill">--</span>
                </div>
            </div>

            <div class="modal-body">
                <div class="chart-legend">
                    <div class="legend-item"><span class="legend-color temp-color"></span> Temperatur (°C)</div>
                    <div class="legend-item"><span class="legend-color rain-color"></span> Niederschlag (mm / %)</div>
                </div>
                
                <div class="chart-scroll-container">
                    <div id="chart-wrapper" class="chart-wrapper"></div>
                </div>

                <div class="hourly-table-container">
                    <h3 class="table-title">Stündlicher Verlauf (24 Stunden)</h3>
                    <div id="hourly-table" class="hourly-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEATHER_META = {
            0: { text: "Klar", icon: "☀️" }, 1: { text: "Meist sonnig", icon: "🌤️" }, 2: { text: "Teilweise bewölkt", icon: "⛅" },
            3: { text: "Bedeckt", icon: "☁️" }, 45: { text: "Nebel", icon: "🌫️" }, 48: { text: "Reifnebel", icon: "🌫️" },
            51: { text: "Leichter Niesel", icon: "🌦️" }, 53: { text: "Nieselregen", icon: "🌧️" }, 55: { text: "Starker Niesel", icon: "🌧️" },
            61: { text: "Leichter Regen", icon: "🌧️" }, 63: { text: "Mäßiger Regen", icon: "🌧️" }, 65: { text: "Starker Regen", icon: "🌧️" },
            71: { text: "Leichter Schnee", icon: "❄️" }, 75: { text: "Starker Schnee", icon: "❄️" },
            80: { text: "Leichte Schauer", icon: "🌦️" }, 81: { text: "Regenschauer", icon: "🌧️" }, 82: { text: "Starke Schauer", icon: "🌧️" },
            95: { text: "Gewitter", icon: "⛈️" }
        };

        const COUNTRY_FLAGS = { "DE": "🇩🇪", "IE": "🇮🇪", "UK": "🇬🇧", "CH": "🇨🇭", "FR": "🇫🇷", "IT": "🇮🇹", "AT": "🇦🇹", "ES": "🇪🇸" };
        const TIME_SLOTS = {
            '8-12': { minHour: 8, maxHour: 12 }, '12-16': { minHour: 12, maxHour: 16 },
            '16-20': { minHour: 16, maxHour: 20 }, '8-20': { minHour: 8, maxHour: 20 },
            '24h': { minHour: 0, maxHour: 23 }
        };

        let TARGETS = [];
        let weatherDataStore = [];
        let currentTimeMode = '8-12';

        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            fetchWeatherData();
        });

        function setupEventListeners() {
            const refreshBtn = document.getElementById('refresh-btn');
            if (refreshBtn) {
                refreshBtn.addEventListener('click', () => {
                    refreshBtn.classList.add('spinning');
                    fetchWeatherData().finally(() => setTimeout(() => refreshBtn.classList.remove('spinning'), 600));
                });
            }

            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentTimeMode = e.target.getAttribute('data-time');
                    renderGrid();
                });
            });

            const modal = document.getElementById('trend-modal');
            const closeBtn = document.getElementById('modal-close-btn');
            if (closeBtn) closeBtn.addEventListener('click', closeTrendModal);
            if (modal) {
                modal.addEventListener('click', (e) => { if (e.target === modal) closeTrendModal(); });
            }
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeTrendModal(); });
        }

        async function fetchWeatherData() {
            showLoader(true);
            weatherDataStore = [];

            try {
                const res = await fetch('./trips.json?v=' + Date.now());
                if (!res.ok) throw new Error(`HTTP ${res.status}: trips.json nicht erreichbar`);
                TARGETS = await res.json();

                if (!Array.isArray(TARGETS) || TARGETS.length === 0) {
                    throw new Error("trips.json enthält keine Stopps.");
                }

                document.getElementById('stat-count').textContent = `${TARGETS.length} Stopps`;

                const results = [];
                for (const item of TARGETS) {
                    const data = await fetchForecastForTarget(item);
                    results.push(data);
                    await new Promise(r => setTimeout(r, 60));
                }

                weatherDataStore = results;
                updateOverallStats();
                renderGrid();
            } catch (err) {
                console.error("Fehler:", err);
                const grid = document.getElementById('weather-grid');
                grid.innerHTML = `<div class="out-notice" style="grid-column:1/-1; color:#fca5a5;">⚠️ ${err.message}</div>`;
            } finally {
                showLoader(false);
            }
        }

        async function fetchForecastForTarget(target) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${target.lat}&longitude=${target.lon}&hourly=temperature_2m,precipitation_probability,precipitation,weathercode,wind_speed_10m,wind_gusts_10m&daily=sunrise,sunset&wind_speed_unit=kmh&timezone=auto&forecast_days=16&past_days=16`;
            
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                
                const hourly = data.hourly || {};
                const times = hourly.time || [];
                const daily = data.daily || {};

                const dayIndices = [];
                for (let i = 0; i < times.length; i++) {
                    if (times[i].startsWith(target.date)) dayIndices.push(i);
                }

                if (dayIndices.length === 0) {
                    return { ...target, available: false, reason: "Datum außerhalb des Zeitfensters" };
                }

                let sunriseStr = '--:--', sunsetStr = '--:--';
                if (daily.time && daily.sunrise && daily.sunset) {
                    const dIdx = daily.time.indexOf(target.date);
                    if (dIdx !== -1) {
                        sunriseStr = daily.sunrise[dIdx]?.split('T')[1]?.substring(0, 5) || '--:--';
                        sunsetStr = daily.sunset[dIdx]?.split('T')[1]?.substring(0, 5) || '--:--';
                    }
                }

                const hourlyDetails = dayIndices.map(i => ({
                    hour: parseInt(times[i].split('T')[1].split(':')[0], 10),
                    hourStr: times[i].split('T')[1]?.substring(0, 5) || `${i}:00`,
                    temp: hourly.temperature_2m?.[i],
                    rainProb: hourly.precipitation_probability?.[i],
                    rainSum: hourly.precipitation?.[i],
                    weatherCode: hourly.weathercode?.[i],
                    windSpeed: hourly.wind_speed_10m?.[i],
                    windGusts: hourly.wind_gusts_10m?.[i]
                }));

                const slotsData = {};
                Object.keys(TIME_SLOTS).forEach(slotKey => {
                    const slot = TIME_SLOTS[slotKey];
                    const slotItems = hourlyDetails.filter(h => h.hour >= slot.minHour && h.hour <= slot.maxHour);
                    
                    const temps = slotItems.map(h => h.temp).filter(v => v != null);
                    const rainProbs = slotItems.map(h => h.rainProb).filter(v => v != null);
                    const rainSums = slotItems.map(h => h.rainSum).filter(v => v != null);
                    const winds = slotItems.map(h => h.windSpeed).filter(v => v != null);
                    const gusts = slotItems.map(h => h.windGusts).filter(v => v != null);
                    const codes = slotItems.map(h => h.weatherCode).filter(v => v != null);

                    const code = codes.length ? codes[0] : 0;
                    const meta = WEATHER_META[code] || { text: "Heiter", icon: "🌤️" };

                    slotsData[slotKey] = {
                        condition: meta.text,
                        icon: meta.icon,
                        tMax: temps.length ? Math.max(...temps) : null,
                        tMin: temps.length ? Math.min(...temps) : null,
                        rainProb: rainProbs.length ? Math.max(...rainProbs) : 0,
                        rainSum: rainSums.length ? rainSums.reduce((a, b) => a + b, 0) : 0,
                        windMax: winds.length ? Math.max(...winds) : 0,
                        windGustsMax: gusts.length ? Math.max(...gusts) : 0
                    };
                });

                return { ...target, available: true, sunrise: sunriseStr, sunset: sunsetStr, slots: slotsData, hourlyDetails };
            } catch (err) {
                return { ...target, available: false, reason: err.message };
            }
        }

        function updateOverallStats() {
            let overallMin = Infinity, overallMax = -Infinity, hasData = false;
            weatherDataStore.forEach(item => {
                if (item.available && item.hourlyDetails) {
                    item.hourlyDetails.forEach(h => {
                        if (h.hour >= 8 && h.hour <= 20 && h.temp != null) {
                            if (h.temp < overallMin) overallMin = h.temp;
                            if (h.temp > overallMax) overallMax = h.temp;
                            hasData = true;
                        }
                    });
                }
            });

            const statEl = document.getElementById('stat-temp-range');
            if (statEl) {
                statEl.innerHTML = hasData ? `${overallMin.toFixed(1)}° <span style="font-weight:400;color:var(--text-muted);font-size:0.8rem;">bis</span> ${overallMax.toFixed(1)}°C` : '--';
            }
        }

        function renderGrid() {
            const grid = document.getElementById('weather-grid');
            grid.innerHTML = '';

            if (!weatherDataStore || weatherDataStore.length === 0) {
                grid.innerHTML = `<div class="out-notice" style="grid-column: 1/-1;">Keine Stopps geladen.</div>`;
                return;
            }

            weatherDataStore.forEach(item => {
                const card = document.createElement('div');
                card.className = `weather-card ${!item.available ? 'out-of-range' : ''}`;
                const flag = COUNTRY_FLAGS[item.country] || '📍';
                const formattedDate = formatDateString(item.date);

                if (!item.available) {
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="city-badge"><span>${flag}</span> <span>${item.city}</span></div>
                            <div class="date-pill">${formattedDate}</div>
                        </div>
                        <div class="out-notice">⏳ ${item.reason}</div>
                    `;
                } else {
                    const stats = item.slots[currentTimeMode] || item.slots['8-12'] || item.slots['24h'];
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="city-badge"><span>${flag}</span> <span>${item.city}</span></div>
                            <div class="date-pill">${formattedDate}</div>
                        </div>
                        <div class="card-body">
                            <div class="weather-info">
                                <div class="weather-icon-wrapper">${stats.icon}</div>
                                <div class="weather-desc">${stats.condition}</div>
                            </div>
                            <div class="temp-box">
                                <div class="temp-max">${stats.tMax?.toFixed(1) || '--'}°C</div>
                                <div class="temp-min">Min ${stats.tMin?.toFixed(1) || '--'}°C</div>
                            </div>
                        </div>
                        <div class="card-metrics">
                            <div class="metric-row">
                                <span class="metric-item">🌧️ Regen: <strong>${stats.rainProb}%</strong> (${stats.rainSum?.toFixed(1)} mm)</span>
                                <span class="metric-item">💨 Wind: <strong>${Math.round(stats.windMax)} km/h</strong></span>
                            </div>
                            <div class="metric-row border-top">
                                <span class="metric-item">🌅 Auf: <strong>${item.sunrise}</strong></span>
                                <span class="metric-item">🌇 Unter: <strong>${item.sunset}</strong></span>
                            </div>
                        </div>
                        <div class="card-click-hint">
                            <span>📈 Trendgraph anzeigen</span> &rarr;
                        </div>
                    `;

                    card.addEventListener('click', () => {
                        openTrendModal(item);
                    });
                }
                grid.appendChild(card);
            });
        }

        function openTrendModal(item) {
            const modal = document.getElementById('trend-modal');
            if (!modal) return;

            const flag = COUNTRY_FLAGS[item.country] || '📍';
            const formattedDate = formatDateStringFull(item.date);
            const dayStats = item.slots ? item.slots['24h'] : null;

            document.getElementById('modal-city-flag').textContent = flag;
            document.getElementById('modal-city-name').textContent = item.city;
            document.getElementById('modal-date-text').textContent = formattedDate;

            if (dayStats) {
                document.getElementById('modal-summary-temp').textContent = `${dayStats.icon} Max ${dayStats.tMax?.toFixed(1)}°C / Min ${dayStats.tMin?.toFixed(1)}°C`;
                document.getElementById('modal-summary-rain').textContent = `🌧️ ${dayStats.rainProb}% (${dayStats.rainSum?.toFixed(1)} mm)`;
                document.getElementById('modal-summary-wind').textContent = `💨 Max ${Math.round(dayStats.windMax || 0)} km/h`;
            }
            document.getElementById('modal-summary-sun').textContent = `☀️ 🌅 ${item.sunrise || '--:--'} • 🌇 ${item.sunset || '--:--'}`;

            const chartWrapper = document.getElementById('chart-wrapper');
            if (chartWrapper && item.hourlyDetails) {
                chartWrapper.innerHTML = generateTrendSVG(item.hourlyDetails);
            }

            const hourlyGrid = document.getElementById('hourly-table');
            if (hourlyGrid && item.hourlyDetails) {
                hourlyGrid.innerHTML = '';
                item.hourlyDetails.forEach(h => {
                    const icon = h.weatherCode !== null ? (WEATHER_META[h.weatherCode]?.icon || '❓') : '⏳';
                    const cardEl = document.createElement('div');
                    cardEl.className = 'hourly-card';
                    cardEl.innerHTML = `
                        <div class="hourly-time">${h.hourStr}</div>
                        <div class="hourly-icon">${icon}</div>
                        <div class="hourly-temp">${h.temp !== null ? h.temp.toFixed(1) + '°' : '--'}</div>
                        <div class="hourly-rain">${h.rainProb || 0}% (${h.rainSum ? h.rainSum.toFixed(1) : '0'}mm)</div>
                    `;
                    hourlyGrid.appendChild(cardEl);
                });
            }

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeTrendModal() {
            const modal = document.getElementById('trend-modal');
            if (modal) modal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        function generateTrendSVG(hourlyList) {
            if (!hourlyList || !hourlyList.length) return '<p>Keine Stundendaten vorhanden.</p>';

            const svgWidth = 720;
            const svgHeight = 220;
            const paddingLeft = 35;
            const paddingRight = 35;
            const paddingTop = 35;
            const paddingBottom = 45;

            const graphW = svgWidth - paddingLeft - paddingRight;
            const graphH = svgHeight - paddingTop - paddingBottom;

            const temps = hourlyList.map(d => d.temp).filter(v => v != null);
            const rainSums = hourlyList.map(d => d.rainSum).filter(v => v != null);
            const rainProbs = hourlyList.map(d => d.rainProb).filter(v => v != null);

            let minT = Math.min(...temps);
            let maxT = Math.max(...temps);
            if (minT === maxT) { minT -= 1; maxT += 1; }
            const tempRange = maxT - minT;

            const maxRainSum = Math.max(...rainSums, 1);
            const n = hourlyList.length;
            const stepX = graphW / (n - 1);

            let barsSVG = '';
            for (let i = 0; i < n; i++) {
                const d = hourlyList[i];
                const x = paddingLeft + i * stepX;
                const rVal = d.rainSum || 0;
                const rProb = d.rainProb || 0;
                
                let barH = 0;
                if (rVal > 0) {
                    barH = Math.min(graphH * 0.75, (rVal / maxRainSum) * (graphH * 0.65) + 8);
                } else if (rProb > 0) {
                    barH = (rProb / 100) * (graphH * 0.4);
                }

                if (barH > 0) {
                    const barW = Math.max(6, stepX * 0.55);
                    const barX = x - barW / 2;
                    const barY = paddingTop + graphH - barH;
                    
                    barsSVG += `
                        <rect x="${barX.toFixed(1)}" y="${barY.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" 
                              rx="3" fill="url(#rainGrad)" opacity="0.85">
                            <title>${d.hourStr} Uhr: ${rVal.toFixed(1)} mm (${rProb}% Regenwahrscheinlichkeit)</title>
                        </rect>
                    `;
                    
                    if (rVal >= 0.2 || rProb >= 40) {
                        const labelText = rVal > 0 ? `${rVal.toFixed(1)}m` : `${rProb}%`;
                        barsSVG += `
                            <text x="${x.toFixed(1)}" y="${(barY - 4).toFixed(1)}" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="600">${labelText}</text>
                        `;
                    }
                }
            }

            const points = [];
            for (let i = 0; i < n; i++) {
                const d = hourlyList[i];
                const x = paddingLeft + i * stepX;
                const y = paddingTop + graphH - ((d.temp - minT) / tempRange) * (graphH * 0.75) - 10;
                points.push({ x, y, temp: d.temp, hour: d.hour, icon: d.weatherCode !== null ? (WEATHER_META[d.weatherCode]?.icon || '') : '' });
            }

            let dLine = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
            for (let i = 1; i < points.length; i++) {
                const pPrev = points[i - 1];
                const pCurr = points[i];
                const cpX1 = pPrev.x + stepX * 0.4;
                const cpY1 = pPrev.y;
                const cpX2 = pCurr.x - stepX * 0.4;
                const cpY2 = pCurr.y;
                dLine += ` C ${cpX1.toFixed(1)} ${cpY1.toFixed(1)}, ${cpX2.toFixed(1)} ${cpY2.toFixed(1)}, ${pCurr.x.toFixed(1)} ${pCurr.y.toFixed(1)}`;
            }

            const dArea = `${dLine} L ${points[points.length - 1].x.toFixed(1)} ${(paddingTop + graphH).toFixed(1)} L ${points[0].x.toFixed(1)} ${(paddingTop + graphH).toFixed(1)} Z`;

            let pointsSVG = '';
            let xLabelsSVG = '';

            for (let i = 0; i < n; i++) {
                const pt = points[i];
                const showLabel = (i % 2 === 0 || i === n - 1);
                
                if (showLabel) {
                    pointsSVG += `
                        <circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="4.5" fill="#6366f1" stroke="#ffffff" stroke-width="2"/>
                        <text x="${pt.x.toFixed(1)}" y="${(pt.y - 8).toFixed(1)}" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">${pt.temp.toFixed(1)}°</text>
                    `;

                    xLabelsSVG += `
                        <text x="${pt.x.toFixed(1)}" y="${(paddingTop + graphH + 18).toFixed(1)}" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">${pt.hour < 10 ? '0' + pt.hour : pt.hour}:00</text>
                        <text x="${pt.x.toFixed(1)}" y="${(paddingTop + graphH + 34).toFixed(1)}" text-anchor="middle" font-size="12">${pt.icon}</text>
                    `;
                }
            }

            return `
                <svg viewBox="0 0 ${svgWidth} ${svgHeight}" width="100%" height="auto" style="overflow: visible;">
                    <defs>
                        <linearGradient id="tempGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
                            <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
                        </linearGradient>
                        <linearGradient id="rainGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
                            <stop offset="100%" stop-color="#6366f1" stop-opacity="0.5"/>
                        </linearGradient>
                    </defs>

                    <line x1="${paddingLeft}" y1="${paddingTop + graphH}" x2="${svgWidth - paddingRight}" y2="${paddingTop + graphH}" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
                    ${barsSVG}
                    <path d="${dArea}" fill="url(#tempGrad)"/>
                    <path d="${dLine}" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
                    ${pointsSVG}
                    ${xLabelsSVG}
                </svg>
            `;
        }

        function formatDateString(isoStr) {
            const parts = isoStr.split('-');
            if (parts.length !== 3) return isoStr;
            const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            const days = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
            const months = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
            return `${days[d.getDay()]}, ${String(d.getDate()).padStart(2, '0')}. ${months[d.getMonth()]}`;
        }

        function formatDateStringFull(isoStr) {
            const parts = isoStr.split('-');
            if (parts.length !== 3) return isoStr;
            const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            const days = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
            const months = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
            return `${days[d.getDay()]}, ${String(d.getDate()).padStart(2, '0')}. ${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        function showLoader(visible) {
            document.getElementById('loader').classList.toggle('hidden', !visible);
            document.getElementById('weather-grid').classList.toggle('hidden', visible);
        }
    </script>
</body>
